<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C28"/>
      <stop offset="100%" stop-color="#090D14"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#E5A50A"/>
    </linearGradient>

    <linearGradient id="rimGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E5A50A" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Mark (Left) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#bgGrad2)" stroke="url(#rimGrad2)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(229, 165, 10, 0.3)" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Pin Outline -->
    <path d="M 50,22 C 37,22 28,32 28,45 C 28,60 50,86 50,86 C 50,86 72,60 72,45 C 72,32 63,22 50,22 Z" 
          fill="none" 
          stroke="rgba(229, 165, 10, 0.4)" 
          stroke-width="1.5" 
          stroke-linecap="round"/>

    <!-- Lightning Bolt -->
    <path d="M 54,26 L 38,54 L 50,54 L 45,82 L 62,51 L 52,51 Z"
          fill="url(#goldGrad)"
          filter="url(#glow2)"/>
    <path d="M 54,26 L 38,54 L 50,54 L 45,82 L 62,51 L 52,51 Z"
          fill="url(#goldGrad)"/>
    <circle cx="45" cy="82" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(130, 20)">
    <!-- Zap Near Me Title -->
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
      <tspan fill="url(#goldGrad)">Zap</tspan>
      <tspan fill="#FFFFFF"> Near Me</tspan>
    </text>

    <!-- Subtitle Pill / Tagline -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="268" height="22" rx="11" fill="rgba(229, 165, 10, 0.12)" stroke="rgba(229, 165, 10, 0.35)" stroke-width="1"/>
      <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="10.5" fill="#E5A50A" letter-spacing="1.2">
        ⚡ NIMIQ PAY MINI APP • LIGHTNING
      </text>
    </g>
  </g>
</svg>
