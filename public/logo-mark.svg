<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C28"/>
      <stop offset="50%" stop-color="#0E141E"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>

    <!-- Golden Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="30%" stop-color="#FFC72C"/>
      <stop offset="70%" stop-color="#E5A50A"/>
      <stop offset="100%" stop-color="#B87700"/>
    </linearGradient>

    <!-- Subtle Amber Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E5A50A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070A0F" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Pin / Radar Gradient -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5A50A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E5A50A" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="228" height="228" rx="52" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Radar Proximity Rings (Near Me Theme) -->
  <circle cx="120" cy="115" r="72" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="120" cy="115" r="54" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="120" cy="115" r="36" fill="url(#radarGrad)" opacity="0.25"/>

  <!-- Geometric Map Pin Outline -->
  <path d="M 120,44 C 92,44 70,66 70,94 C 70,128 120,186 120,186 C 120,186 170,128 170,94 C 170,66 148,44 120,44 Z" 
        fill="none" 
        stroke="rgba(229, 165, 10, 0.35)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Dynamic Golden Lightning Bolt (Zap Theme) -->
  <path d="M 128,52 L 94,116 L 120,116 L 110,178 L 148,110 L 124,110 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"/>
  
  <!-- Sharp core overlay for crispness -->
  <path d="M 128,52 L 94,116 L 120,116 L 110,178 L 148,110 L 124,110 Z"
        fill="url(#boltGrad)"/>

  <!-- Pinpoint Spark at the Epicenter -->
  <circle cx="110" cy="178" r="3" fill="#FFFFFF" filter="url(#softGlow)"/>
  <circle cx="110" cy="178" r="1.5" fill="#FFE066"/>
</svg>
